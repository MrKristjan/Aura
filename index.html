<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA - Trailer previews</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="intro-modal-backdrop" id="introModal">
    <div class="intro-card">
      <div style="font-size: 2.5rem; color: var(--accent-red); margin-bottom: 10px;">
        <i class="fa-solid fa-clapperboard"></i>
      </div>
      <h2>Welcome to <span>AURA</span></h2>
      <p>Explore a massive catalog of top-rated track trending cinema favorites, and preview cinematic trailers!</p>
      <button class="btn-get-started" onclick="closeIntroModal()">Explore Movies</button>
    </div>
  </div>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="brand-logo"><i class="fa-solid fa-film"></i>AURA<span>.</span></a>
    </div>
    
    <div class="nav-right">
      <div class="global-search-form">
        <i class="fa-solid fa-magnifying-glass search-icon-left"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies..." oninput="handleGlobalSearch(event)">
      </div>
    </div>
  </nav>

  <header class="hero" id="heroBanner">
    <div class="hero-content">
      <div class="tagline" id="heroTagline"><i class="fa-solid fa-fire"></i> MOVIE COLLECTION</div>
      <h1 class="hero-title" id="heroTitle">LOADING...</h1>
      <p class="hero-desc" id="heroDesc">Explore popular blockbusters or search any title worldwide using the search bar above.</p>
      <button class="btn-play-hero" id="heroPlayBtn">
        <i class="fa-solid fa-play"></i> Watch Trailer
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="section-header">
      <div class="section-title" id="gridSectionTitle">
        <i class="fa-solid fa-clapperboard" style="color: var(--accent-red);"></i> Popular Movies Hub
      </div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
    
    <div class="load-more-container" id="loadMoreContainer">
      <button class="btn-load-more" onclick="loadMoreMovies()">
        <i class="fa-solid fa-plus"></i> Load More Movies
      </button>
    </div>
  </main>

  <div class="cinema-player" id="cinemaPlayer" onmousemove="handlePlayerInteraction()" ontouchstart="handlePlayerInteraction()">
    <div class="player-controls-overlay" id="playerControlsOverlay">
      <div class="control-top-bar">
        <button class="btn-circle-action" onclick="closeTrailer(event)" title="Close Player"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="control-bottom-bar" onclick="event.stopPropagation()">
        <button class="btn-cinema-action" onclick="skipTime(-10)"><i class="fa-solid fa-backward-step"></i> -10s</button>
        <button class="btn-circle-action" id="pausePlayBtn" onclick="togglePlayPause()" title="Play / Pause"><i class="fa-solid fa-pause" id="pausePlayIcon"></i></button>
        <button class="btn-cinema-action" onclick="skipTime(10)">+10s <i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

    <div class="video-wrapper">
      <div id="ytPlayerContainer"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
